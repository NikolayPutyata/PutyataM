# Автозаливка НОВОГО сайту (web/, Next.js, статичний експорт) на хостинг (фрихост) по FTP
# після кожного оновлення гілки main. Поки FTP-дані не задані — заливка пропускається.
# Налаштування (Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: FTP_SERVER_DIR (папка сайту на хостингу, з «/» в кінці, напр. /weksar.com/www/)
#              FTP_PROTOCOL (необовʼязково: ftps за замовчуванням, або ftp)
#              GTM_ID (необовʼязково: ID Google Tag Manager, GTM-XXXXXXX)
#              LEAD_ENDPOINT (необовʼязково: адреса сервера заявок)
# Інструкція: docs/deploy.md. Повернути старий сайт: див. там же, розділ «Відкат».

name: Деплой на хостинг

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' && vars.FTP_SERVER_DIR != '' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: FTP не налаштовано — пропускаю
        if: env.HAS_FTP != 'true'
        working-directory: .
        run: echo "::notice::FTP-дані не задані (див. docs/deploy.md), заливку пропущено."

      - uses: actions/checkout@v4
        if: env.HAS_FTP == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_FTP == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Встановити залежності
        if: env.HAS_FTP == 'true'
        run: npm ci

      - name: Зібрати сайт
        if: env.HAS_FTP == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_ENV: production
          NEXT_PUBLIC_GTM_ID: ${{ vars.GTM_ID }}
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT || 'https://unium-server-q8g7u.ondigitalocean.app/telegram/send' }}

      - name: Залити на хостинг
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./web/out/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
